version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /modules/features/operator/menu/_source/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
