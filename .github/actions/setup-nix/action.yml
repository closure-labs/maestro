# SPDX-License-Identifier: Apache-2.0
name: Set up Maestro Nix
description: Install Determinate Nix with a CI-only public substituter baseline

runs:
  using: composite
  steps:
    - name: Reserve disk for complete Nix validation
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/disk.py"

    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      with:
        extra-conf: |
          substituters = https://cache.nixos.org/

    - name: Enforce the public CI substituter baseline
      shell: bash
      run: |
        nix_cli=$(readlink -f "$(command -v nix)")
        nix_version=$("$nix_cli" --version)
        printf 'Hosted Nix: %s (%s)\n' "$nix_version" "$nix_cli"
        [[ $nix_version == *Determinate* ]]
        determinate-nixd auth logout
        printf 'substituters = https://cache.nixos.org/\n' |
          sudo tee -a /etc/nix/nix.custom.conf >/dev/null
        runner_budget=$(bash "$GITHUB_ACTION_PATH/resources.sh")
        printf '%s\n' "$runner_budget" | sudo tee -a /etc/nix/nix.custom.conf >/dev/null
        max_jobs=$(awk '$1 == "max-jobs" {print $3}' <<<"$runner_budget")
        cores=$(awk '$1 == "cores" {print $3}' <<<"$runner_budget")
        public_config=$(bash "$GITHUB_ACTION_PATH/export-runtime.sh" "$nix_cli" "$max_jobs" "$cores")
        export NIX_CONFIG="$public_config"
        sudo systemctl restart nix-daemon.service
        substituters=$(nix config show substituters)
        printf 'CI substituters: %s\n' "$substituters"
        [[ " $substituters " == *" https://cache.nixos.org/ "* ]]
        [[ $substituters != *cache.flakehub.com* ]]
        [[ $(nix config show max-jobs) == "$max_jobs" ]]
        [[ $(nix config show cores) == "$cores" ]]
        printf 'Effective max-jobs: %s; cores: %s\n' \
          "$(nix config show max-jobs)" "$(nix config show cores)"
