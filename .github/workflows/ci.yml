# SPDX-License-Identifier: Apache-2.0
name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate && inputs.release_request_id != '' && format('Maestro release request {0}', inputs.release_request_id) || format('CI {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 8 1 */2 *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run checks without planning installer artifacts
        required: false
        type: boolean
        default: false
      force_artifact:
        description: Rebuild and boot the installer even if state is reusable
        required: false
        type: boolean
        default: false
      release_request_id:
        description: Internal immutable release-request origin run ID
        type: string
        required: false
        default: ""
      audit_overlap:
        description: Pilot repository audit alongside qualification; all gates remain required
        required: false
        type: boolean
        default: false
      release_candidate:
        description: Isolate an internal release qualification from ordinary main CI
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ci-${{ (github.event_name == 'workflow_dispatch' && inputs.release_candidate && format('release-{0}', github.run_id)) || github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  route:
    name: Plan CI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      graph_sha256: ${{ steps.graph.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ contains(fromJSON('["pull_request","push","merge_group"]'), github.event_name) && '0' || '1' }}
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Route authoritative downstream CI work
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          FORCE_ARTIFACT: ${{ inputs.force_artifact || false }}
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:route

      - name: Compare immutable derivation graphs in shadow mode
        id: graph
        env:
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          GRAPH_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'true' || 'false' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:graph:plan

      - name: Retain bound derivation graph and shadow routing plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ci-graph
          path: ci-graph/
          if-no-files-found: error
          retention-days: 90

      - name: Retain decision-only structural eligibility
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-decision-only-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained-candidate.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload qualification state pointer
        if: fromJSON(steps.plan.outputs.plan).qualification.required
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-qualification-state
          path: maestro-qualification-state.json
          if-no-files-found: error
          retention-days: 90

  audit:
    name: Repository checks
    needs: route
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Validate repository
        env:
          MAESTRO_CI_AUDIT_MANIFEST: ${{ runner.temp }}/maestro-audit/audit.json
          MAESTRO_CI_AUDIT_TIMINGS: ${{ runner.temp }}/maestro-audit/timings.json
        run: nix run --accept-flake-config .#devenv -- tasks run --option 'packages:pkgs!' '' ci:repository-audit

      - name: Retain native audit manifest and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-audit-${{ github.job }}
          path: ${{ runner.temp }}/maestro-audit/
          if-no-files-found: ignore
          retention-days: 30

  retained:
    name: Verify retained evidence without building or signing
    needs: route
    if: >-
      needs.route.result == 'success' && fromJSON(needs.route.outputs.plan).retained_evidence != null &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
       (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      reused: ${{ steps.verify.outputs.reused || 'false' }}
      descriptor_hash: ${{ steps.verify.outputs.descriptor_hash }}
    steps:
      - name: Checkout protected verification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: controller
          persist-credentials: false
      - name: Checkout candidate as read-only evaluation data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: ./controller/.github/actions/setup-nix # zizmor: ignore[self-repository] -- protected main controller checkout; candidate setup code is never executed.
      - name: Mint protected-main read-only admission reader
        if: >-
          hashFiles('controller/.github/workflows/ci.yml') == hashFiles('candidate/.github/workflows/ci.yml') &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))
        id: authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Verify original producers, exact inputs and current merged authority
        id: verify
        if: hashFiles('controller/.github/workflows/ci.yml') == hashFiles('candidate/.github/workflows/ci.yml')
        working-directory: controller
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token || github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          CI_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          CI_PLAN: ${{ needs.route.outputs.plan }}
          DECISION_ONLY_OPERATION: verify
          DECISION_ONLY_OUTPUT: ${{ runner.temp }}/retained-evidence/retained-publication-intent.json
          MAESTRO_DECISION_ONLY_REUSE_ENABLED: ${{ vars.MAESTRO_DECISION_ONLY_REUSE_ENABLED || 'false' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:retained-evidence
      - name: Retain shadow eligibility and original evidence identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-retained-publication-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-evidence/retained-publication-intent.json
          if-no-files-found: ignore
          retention-days: 30

  qualification:
    name: Qualify installer media and evidence
    needs: [route, retained]
    if: >-
      !cancelled() && needs.route.result == 'success' &&
      fromJSON(needs.route.outputs.plan).qualification.required && needs.retained.outputs.reused != 'true' &&
      (vars.MAESTRO_DECISION_ONLY_REUSE_ENABLED != 'true' || contains(fromJSON('["success","skipped"]'), needs.retained.result))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Download already-qualified media
        if: fromJSON(needs.route.outputs.plan).qualification.mode == 'refresh-evidence'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: maestro-installer
          path: reused-media
          run-id: ${{ fromJSON(needs.route.outputs.plan).qualification.media_run_id }}

      - name: Download reusable supply evidence
        if: contains(fromJSON('["reuse","qualify-media-reuse-evidence"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: maestro-evidence
          path: reused-evidence
          run-id: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}

      - name: Assemble qualified media and evidence
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        env:
          EXPECTED_MEDIA_INPUT: ${{ fromJSON(needs.route.outputs.plan).qualification.media_input }}
          EXPECTED_EVIDENCE_INPUT: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_input }}
          EXPECTED_EVIDENCE_RUN_ID: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_MODE: ${{ fromJSON(needs.route.outputs.plan).qualification.mode }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:assemble

      - name: Download previously qualified distribution transport
        if: fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: maestro-security-report
          path: qualified-distribution
          run-id: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}

      - name: Authenticate original producer and restore exact outputs for rescanning
        if: fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_INVENTORY: reused-evidence
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:restore

      - name: Boot the installer ISO
        if: contains(fromJSON('["qualify-media-reuse-evidence","qualify-media"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        env:
          BOOT_LOG: ${{ runner.temp }}/qemu-boot.log
          INSTALLER_ISO: result-installer/iso/maestro-installer.iso
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:boot-media

      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-qualification-diagnostics
          path: ${{ runner.temp }}/maestro-qualification-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload boot log after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-installer-boot-log
          path: ${{ runner.temp }}/qemu-boot.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Download immutable qualification state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-qualification-state
          path: .

      - name: Upload installer and SBOM assets
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-installer
          path: |
            result-installer/iso/maestro-installer.iso
            maestro-installer.iso.sha256
            maestro-system.spdx.json
            maestro-system.spdx.json.sha256
            maestro-system.cdx.json
            maestro-system.cdx.json.sha256
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.assertion.json.sha256
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.spdx.json.sha256
            xen-orchestra-supply.cdx.json
            xen-orchestra-supply.cdx.json.sha256
            maestro-qualification-state.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload reusable supply evidence
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-evidence
          path: |
            maestro-system.spdx.json
            maestro-system.spdx.json.sha256
            maestro-system.cdx.json
            maestro-system.cdx.json.sha256
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.assertion.json.sha256
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.spdx.json.sha256
            xen-orchestra-supply.cdx.json
            xen-orchestra-supply.cdx.json.sha256
            maestro-qualification-state.json
          if-no-files-found: error
          retention-days: 90

      - name: Scan current databases beside the realized qualification outputs
        env:
          SECURITY_INVENTORY: ${{ fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse' && 'reused-evidence' || '.' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:security:scan

      - name: Bind exact scanned distribution and retain its closure transport
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
        env:
          SECURITY_INVENTORY: ${{ fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse' && 'reused-evidence' || '.' }}
          DECISION_PRODUCER_WORKFLOW: .github/workflows/ci.yml
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:candidate

      - name: Upload native scan and exact distribution transport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-security-report
          path: security-report
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  security:
    name: Scan qualified dependency inventories
    needs: [route, retained, qualification]
    if: >-
      !cancelled() && needs.route.result == 'success' &&
      fromJSON(needs.route.outputs.plan).qualification.required && needs.retained.outputs.reused != 'true' &&
      (vars.MAESTRO_DECISION_ONLY_REUSE_ENABLED != 'true' || contains(fromJSON('["success","skipped"]'), needs.retained.result)) &&
      (needs.qualification.result == 'success' || needs.qualification.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Download this run's native qualification report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: maestro-security-report
          path: security-report

      - name: Validate complete fresh native qualification without importing candidate code
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:security:verify-native

      - name: Attest native evidence and immutable product identity
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            security-report/scans.json
            security-report/product.json

  signing:
    name: Sign protected-main qualification
    needs: [route, audit, qualification, security]
    if: >-
      !cancelled() && needs.route.result == 'success' && needs.security.result == 'success' &&
      needs.audit.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      fromJSON(needs.route.outputs.plan).qualification.required &&
      (needs.qualification.result == 'success' || needs.qualification.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      artifact-metadata: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Download inventory to sign
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-installer
          path: .

      - name: Download current qualification pointer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-qualification-state
          path: .

      - name: Validate protected source before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:sign-check

      - name: Attest immutable qualification pointer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: maestro-qualification-state.json

      - name: Attest complete installer inventory
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            result-installer/iso/maestro-installer.iso
            maestro-system.spdx.json
            maestro-system.cdx.json
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.cdx.json

      - name: Bind the SPDX SBOM to the installer
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/maestro-installer.iso
          sbom-path: maestro-system.spdx.json

  release_signal:
    name: Signal completed release qualification
    needs: verdict
    if: >-
      !cancelled() && needs.verdict.result == 'success' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.release_candidate == true &&
      inputs.release_request_id != '' && vars.MAESTRO_RELEASE_CONTINUATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Signal exact immutable release request
        env:
          GH_TOKEN: ${{ github.token }}
          MAESTRO_RELEASE_CONTINUATION_ENABLED: ${{ vars.MAESTRO_RELEASE_CONTINUATION_ENABLED || 'false' }}
          MAESTRO_RELEASE_RETIRED_REQUEST_RUN_IDS: ${{ vars.MAESTRO_RELEASE_RETIRED_REQUEST_RUN_IDS || '[]' }}
          RELEASE_REQUEST_RUN_ID: ${{ inputs.release_request_id }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:signal

  verdict:
    name: Required CI verdict
    if: ${{ !cancelled() }}
    needs:
      - route
      - audit
      - retained
      - qualification
      - signing
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Enforce the conditional CI graph
        env:
          AUDIT_REQUIRED: true
          AUDIT_RESULT: ${{ needs.audit.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SIGNING_RESULT: ${{ needs.signing.result }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          CI_PLAN: ${{ needs.route.outputs.plan }}
          ROUTE_RESULT: ${{ needs.route.result }}
          RETAINED_RESULT: ${{ needs.retained.result }}
          RETAINED_REUSE: ${{ needs.retained.outputs.reused || 'false' }}
          RETAINED_DESCRIPTOR_HASH: ${{ needs.retained.outputs.descriptor_hash }}
