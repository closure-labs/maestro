# SPDX-License-Identifier: Apache-2.0
name: CI
run-name: ${{ format('CI {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 8 1 */2 *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run checks without planning installer artifacts
        required: false
        type: boolean
        default: false
      force_artifact:
        description: Rebuild and boot the installer even if state is reusable
        required: false
        type: boolean
        default: false
      release_candidate:
        description: Isolate an internal release qualification from ordinary main CI
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ci-${{ (github.event_name == 'workflow_dispatch' && inputs.release_candidate && format('release-{0}', github.run_id)) || (github.event_name == 'push' && format('branch-{0}', github.ref)) || github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  incoming_secret_scan:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    uses: $/.github/workflows/repository-secret-scan.yml

  route:
    name: Plan CI
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'merge_group' && 30 || 90 }}
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      plan: ${{ steps.graph.outputs.route_plan }}
      graph_mode: ${{ steps.graph.outputs.scheduling_mode }}
      graph_sha256: ${{ steps.graph.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ contains(fromJSON('["pull_request","push","merge_group"]'), github.event_name) && '0' || '2' }}
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Route authoritative downstream CI work
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          FORCE_ARTIFACT: ${{ inputs.force_artifact || false }}
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:route

      - name: Bind immutable graph and authoritative native route
        id: graph
        env:
          CI_PLAN: ${{ steps.plan.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
          FORCE_ARTIFACT: ${{ inputs.force_artifact || false }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          GRAPH_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'true' || 'false' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:graph:plan

      - name: Retain bound derivation graph and final routing plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ci-graph
          path: ci-graph/
          if-no-files-found: error
          retention-days: 90

      - name: Upload qualification state pointer
        if: fromJSON(steps.graph.outputs.route_plan).qualification.required
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-qualification-state
          path: maestro-qualification-state.json
          if-no-files-found: error
          retention-days: 90

  audit:
    name: Repository checks
    needs: route
    outputs:
      reference_sha256: ${{ steps.reference.outputs.manifest_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Download candidate graph for full-audit binding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-ci-graph
          path: ci-graph
      - name: Validate repository
        env:
          GH_TOKEN: ${{ github.token }}
          MAESTRO_CI_AUDIT_MANIFEST: ${{ runner.temp }}/maestro-audit/audit.json
          MAESTRO_CI_AUDIT_TIMINGS: ${{ runner.temp }}/maestro-audit/timings.json
          MAESTRO_NIX_EVENTS_DIR: ${{ runner.temp }}/maestro-audit/nix-events
        run: nix run --accept-flake-config .#devenv -- tasks run --option 'packages:pkgs!' '' ci:repository-audit

      - name: Bind complete audit reference to this candidate and attempt
        id: reference
        env:
          GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
          MAESTRO_AUDIT_DIRECTORY: ${{ runner.temp }}/maestro-audit
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:graph:reference

      - name: Retain native audit manifest and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-audit-${{ github.job }}
          path: ${{ runner.temp }}/maestro-audit/
          if-no-files-found: ignore
          retention-days: 30

  qualification:
    name: Build, scan and boot appliance
    needs: route
    if: fromJSON(needs.route.outputs.plan).qualification.required
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'merge_group' && 225 || 360 }}
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      manifest_sha256: ${{ steps.inventory_binding.outputs.manifest_sha256 }}
      scan_result: ${{ steps.native_scan.conclusion }}
      boot_sha256: ${{ steps.boot_evidence.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Download maestro-ci-graph
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-ci-graph
          path: ci-graph

      - name: Build appliance and operator tools
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        id: appliance
        env:
          GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:build:appliance

      - name: Build installer ISO
        if: contains(fromJSON('["qualify-media","qualify-media-reuse-evidence"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        id: installer
        env:
          GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
          TRANSFER_MANIFEST_SHA256: ${{ steps.appliance.outputs.manifest_sha256 }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:build:installer

      - name: Download already-qualified media
        if: contains(fromJSON('["reuse","refresh-evidence"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: maestro-installer
          path: reused-media
          run-id: ${{ fromJSON(needs.route.outputs.plan).qualification.media_run_id }}

      - name: Download reusable supply evidence
        if: contains(fromJSON('["reuse","qualify-media-reuse-evidence"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: maestro-evidence
          path: reused-evidence
          run-id: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}

      - name: Assemble qualified media and evidence
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        env:
          APPLIANCE_MANIFEST_SHA256: ${{ steps.appliance.outputs.manifest_sha256 }}
          INSTALLER_MANIFEST_SHA256: ${{ steps.installer.outputs.manifest_sha256 }}
          EXPECTED_MEDIA_INPUT: ${{ fromJSON(needs.route.outputs.plan).qualification.media_input }}
          EXPECTED_EVIDENCE_INPUT: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_input }}
          EXPECTED_EVIDENCE_RUN_ID: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_MODE: ${{ fromJSON(needs.route.outputs.plan).qualification.mode }}
          MAESTRO_CI_MEASURE_PHASE: inventory
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:inventory:assets

      - name: Download exact qualified evidence before choosing transport
        if: fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}
          CANDIDATE_WORKFLOW: .github/workflows/ci.yml
          CANDIDATE_REQUIRED: 'true'
          QUALIFICATION_METADATA_ONLY: 'true'
          DECISION_DIRECTORY: qualified-distribution
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:download

      - name: Authenticate producer and prefer exact Nix cache outputs before transport
        if: fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_INVENTORY: reused-evidence
          QUALIFICATION_CACHE_FIRST: 'true'
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:restore

      - name: Download immutable qualification state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-qualification-state
          path: .

      - name: Upload installer and SBOM assets
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-installer
          path: |
            result-installer/iso/maestro-installer.iso
            maestro-installer.iso.sha256
            maestro-system.spdx.json
            maestro-system.spdx.json.sha256
            maestro-system.cdx.json
            maestro-system.cdx.json.sha256
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.assertion.json.sha256
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.spdx.json.sha256
            xen-orchestra-supply.cdx.json
            xen-orchestra-supply.cdx.json.sha256
            maestro-qualification-state.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload reusable supply evidence
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-evidence
          path: |
            maestro-system.spdx.json
            maestro-system.spdx.json.sha256
            maestro-system.cdx.json
            maestro-system.cdx.json.sha256
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.assertion.json.sha256
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.spdx.json.sha256
            xen-orchestra-supply.cdx.json
            xen-orchestra-supply.cdx.json.sha256
            maestro-qualification-state.json
          if-no-files-found: error
          retention-days: 90

      - name: Bind local inventory identities without exporting a closure
        id: inventory_binding
        env:
          SECURITY_INVENTORY: ${{ fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse' && 'reused-evidence' || '.' }}
          GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:inventory:bind

      - name: Retain small inventory and ISO binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-inventory-binding
          path: inventory-binding/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify inventory document bytes against the bound producer
        env:
          GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
          TRANSFER_MANIFEST_SHA256: ${{ steps.inventory_binding.outputs.manifest_sha256 }}
          SECURITY_INVENTORY: ${{ fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse' && 'reused-evidence' || '.' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:inventory:verify

      - name: Scan current databases beside the realized qualification outputs
        id: native_scan
        env:
          MAESTRO_CI_MEASURE_PHASE: scan
          SECURITY_INVENTORY: ${{ fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse' && 'reused-evidence' || '.' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:security:scan

      - name: Bind exact scanned distribution and retain its closure transport
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
        env:
          SECURITY_INVENTORY: ${{ fromJSON(needs.route.outputs.plan).qualification.mode == 'reuse' && 'reused-evidence' || '.' }}
          DECISION_PRODUCER_WORKFLOW: .github/workflows/ci.yml
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:candidate

      - name: Retain exact distribution transport separately
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-distribution-transport
          path: security-report/distribution-cache.tar.part-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload native qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-security-report
          path: |
            security-report/
            !security-report/distribution-cache.tar.part-*
          if-no-files-found: error
          # JSON/SBOM text compresses; keep the separate zstd transport at level 0.
          compression-level: 6
          retention-days: 90

      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-qualification-diagnostics
          path: ${{ runner.temp }}/maestro-qualification-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Boot the installer ISO
        if: contains(fromJSON('["qualify-media-reuse-evidence","qualify-media"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        env:
          BOOT_LOG: ${{ runner.temp }}/qemu-boot.log
          INSTALLER_ISO: result-installer/iso/maestro-installer.iso
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:boot-media

      - name: Bind executed or verified retained boot evidence
        id: boot_evidence
        env:
          INVENTORY_MANIFEST_SHA256: ${{ steps.inventory_binding.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
          QUALIFICATION_MODE: ${{ fromJSON(needs.route.outputs.plan).qualification.mode }}
          EXPECTED_MEDIA_INPUT: ${{ fromJSON(needs.route.outputs.plan).qualification.media_input }}
          BOOT_LOG: ${{ runner.temp }}/qemu-boot.log
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:boot:evidence

      - name: Retain bound boot result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-boot-result
          path: boot-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain maestro-installer-boot-log
        if: always() && contains(fromJSON('["qualify-media","qualify-media-reuse-evidence"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-installer-boot-log
          path: ${{ runner.temp }}/qemu-boot.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Retain local build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-native-results-qualification
          path: |
            appliance-transfer/*.json
            appliance-transfer/nix-events/
            installer-transfer/*.json
            installer-transfer/nix-events/
          if-no-files-found: ignore
          retention-days: 30

  security:
    name: Verify release evidence
    needs: [route, audit, qualification]
    if: >-
      needs.audit.result == 'success' && needs.qualification.result == 'success' &&
      needs.qualification.outputs.scan_result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'merge_group' && 15 || 30 }}
    permissions:
      contents: read
      actions: read
    outputs:
      result_sha256: ${{ steps.bound_result.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Download this run's native qualification report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: maestro-security-report
          path: security-report

      - name: Validate complete fresh native qualification without importing candidate code
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:security:verify-native

      - name: Download bound boot result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-boot-result
          path: .
      - name: Download derivation plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-ci-graph
          path: ci-graph
      - name: Download exact complete-validation reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-audit-audit
          path: complete-audit
      - name: Bind complete graph and release results
        id: bound_result
        env:
          GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
          CI_PLAN: ${{ needs.route.outputs.plan }}
          BOOT_RESULT_SHA256: ${{ needs.qualification.outputs.boot_sha256 }}
          INVENTORY_TRANSFER_SHA256: ${{ needs.qualification.outputs.manifest_sha256 }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          AUDIT_REFERENCE_SHA256: ${{ needs.audit.outputs.reference_sha256 }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          SCAN_RESULT: ${{ needs.qualification.result == 'skipped' && 'skipped' || needs.qualification.outputs.scan_result }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:graph:result
      - name: Retain complete bound graph result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ci-result
          path: ci-result.json
          if-no-files-found: error
          retention-days: 90


  signing:
    name: Sign protected-main qualification
    needs: [route, audit, qualification, security]
    if: >-
      needs.security.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      artifact-metadata: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Download inventory to sign
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-installer
          path: .

      - name: Download current qualification pointer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-qualification-state
          path: .

      - name: Download complete graph result to sign
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-ci-result
          path: .

      - name: Validate protected source before signing
        env:
          GRAPH_RESULT_REQUIRED: true
          CI_RESULT_SHA256: ${{ needs.security.outputs.result_sha256 }}
          GRAPH_SCHEDULING_MODE: ${{ needs.route.outputs.graph_mode }}
          CI_GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:sign-check

      - name: Download protected-main native security report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-security-report
          path: security-report

      - name: Attest native evidence and immutable product identity
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            security-report/scans.json
            security-report/product.json

      - name: Attest complete graph result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ci-result.json

      - name: Attest immutable qualification pointer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: maestro-qualification-state.json

      - name: Attest complete installer inventory
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            result-installer/iso/maestro-installer.iso
            maestro-system.spdx.json
            maestro-system.cdx.json
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.cdx.json

      - name: Bind the SPDX SBOM to the installer
        if: fromJSON(needs.route.outputs.plan).qualification.mode != 'reuse'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/maestro-installer.iso
          sbom-path: maestro-system.spdx.json

  verdict:
    name: Required CI verdict
    if: ${{ !cancelled() }}
    needs:
      - incoming_secret_scan
      - route
      - audit
      - qualification
      - signing
      - security
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'merge_group' && 15 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Download complete graph result for verdict
        if: needs.security.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-ci-result
          path: .

      - name: Enforce the conditional CI graph
        env:
          INCOMING_SECRET_RESULT: ${{ needs.incoming_secret_scan.result }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          FORCE_ARTIFACT: ${{ inputs.force_artifact || false }}
          GRAPH_RESULT_REQUIRED: ${{ needs.security.result == 'success' && 'true' || 'false' }}
          CI_RESULT_SHA256: ${{ needs.security.outputs.result_sha256 }}
          GRAPH_SCHEDULING_MODE: ${{ needs.route.outputs.graph_mode }}
          CI_GRAPH_PLAN_SHA256: ${{ needs.route.outputs.graph_sha256 }}
          SCAN_RESULT: ${{ needs.qualification.result == 'skipped' && 'skipped' || needs.qualification.outputs.scan_result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SIGNING_RESULT: ${{ needs.signing.result }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          CI_PLAN: ${{ needs.route.outputs.plan }}
          ROUTE_RESULT: ${{ needs.route.result }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:verdict

      - name: Download small native realization diagnostics
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: maestro-native-results-*
          path: ci-observed/builds
      - name: Download native audit diagnostics
        if: always() && needs.audit.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-audit-audit
          path: ci-observed/audit
      - name: Download graph diagnostics
        if: always() && needs.route.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-ci-graph
          path: ci-graph
      - name: Summarize observed work and durations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:graph:summary
      - name: Retain observed CI summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ci-summary
          path: ci-summary.json
          if-no-files-found: ignore
          retention-days: 90
