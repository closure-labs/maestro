# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 8 1 */2 *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run checks without planning installer artifacts
        required: false
        type: boolean
        default: false
      force_artifact:
        description: Rebuild and boot the installer even if state is reusable
        required: false
        type: boolean
        default: false
      release_candidate:
        description: Isolate an internal release qualification from ordinary main CI
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ci-${{ (github.event_name == 'workflow_dispatch' && inputs.release_candidate && format('release-{0}', github.run_id)) || github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  route:
    name: Audit repository and route downstream work
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ contains(fromJSON('["pull_request","push","merge_group"]'), github.event_name) && '0' || '1' }}
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Route authoritative downstream CI work
        id: plan
        env:
          ALLOW_REUSE: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.force_artifact != true)) && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          FORCE_ARTIFACT: ${{ inputs.force_artifact || false }}
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:route

      - name: Validate repository
        run: nix run --accept-flake-config .#devenv -- tasks run --option 'packages:pkgs!' '' ci:repository-audit

      - name: Upload qualification state pointer
        if: fromJSON(steps.plan.outputs.plan).qualification.required
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-qualification-state
          path: maestro-qualification-state.json
          if-no-files-found: error
          retention-days: 90

  fix-hashes:
    name: Repair Dependabot Nix hashes
    needs: route
    if: >-
      always() &&
      needs.route.result == 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout trusted hash-fixer automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Repair and push tracked Nix hashes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' automation:fix-hashes

  qualification:
    name: Qualify installer media and evidence
    needs: route
    if: contains(fromJSON('["refresh-evidence","qualify-media-reuse-evidence","qualify-media"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download already-qualified media
        if: fromJSON(needs.route.outputs.plan).qualification.mode == 'refresh-evidence'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: maestro-installer
          path: reused-media
          run-id: ${{ fromJSON(needs.route.outputs.plan).qualification.media_run_id }}

      - name: Download reusable supply evidence
        if: fromJSON(needs.route.outputs.plan).qualification.mode == 'qualify-media-reuse-evidence'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: maestro-evidence
          path: reused-evidence
          run-id: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}

      - name: Assemble qualified media and evidence
        env:
          EXPECTED_EVIDENCE_INPUT: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_input }}
          EXPECTED_EVIDENCE_RUN_ID: ${{ fromJSON(needs.route.outputs.plan).qualification.evidence_run_id }}
          QUALIFICATION_MODE: ${{ fromJSON(needs.route.outputs.plan).qualification.mode }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:assemble

      - name: Boot the installer ISO
        if: contains(fromJSON('["qualify-media-reuse-evidence","qualify-media"]'), fromJSON(needs.route.outputs.plan).qualification.mode)
        env:
          BOOT_LOG: ${{ runner.temp }}/qemu-boot.log
          INSTALLER_ISO: result-installer/iso/maestro-installer.iso
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:qualification:boot-media

      - name: Upload boot log after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-installer-boot-log
          path: ${{ runner.temp }}/qemu-boot.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Attest installer provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/maestro-installer.iso

      - name: Bind the SPDX SBOM to the installer
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/maestro-installer.iso
          sbom-path: maestro-system.spdx.json

      - name: Download immutable qualification state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maestro-qualification-state
          path: .

      - name: Upload installer and SBOM assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-installer
          path: |
            result-installer/iso/maestro-installer.iso
            maestro-installer.iso.sha256
            maestro-system.spdx.json
            maestro-system.spdx.json.sha256
            maestro-system.cdx.json
            maestro-system.cdx.json.sha256
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.assertion.json.sha256
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.spdx.json.sha256
            xen-orchestra-supply.cdx.json
            xen-orchestra-supply.cdx.json.sha256
            maestro-qualification-state.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload reusable supply evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-evidence
          path: |
            maestro-system.spdx.json
            maestro-system.spdx.json.sha256
            maestro-system.cdx.json
            maestro-system.cdx.json.sha256
            xen-orchestra-supply.assertion.json
            xen-orchestra-supply.assertion.json.sha256
            xen-orchestra-supply.spdx.json
            xen-orchestra-supply.spdx.json.sha256
            xen-orchestra-supply.cdx.json
            xen-orchestra-supply.cdx.json.sha256
            maestro-qualification-state.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish reusable main outputs
    needs:
      - route
      - qualification
    if: >-
      always() &&
      needs.route.result == 'success' &&
      fromJSON(needs.route.outputs.plan).publish_required &&
      (needs.qualification.result == 'success' || needs.qualification.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: maestro-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Publish exact planned closures to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:publish

      - name: Publish the rolling flake to FlakeHub
        uses: DeterminateSystems/flakehub-push@e001ee821cdb763ef120c01f1048bfb2f938bb9c # main, Node.js 24 (post-v6)
        with:
          visibility: public
          name: closure-labs/maestro
          rolling: true
          rolling-minor: 2
          include-output-paths: true

  verdict:
    name: Required CI verdict
    if: always()
    needs:
      - route
      - qualification
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce the conditional CI graph
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          CI_PLAN: ${{ needs.route.outputs.plan }}
          ROUTE_RESULT: ${{ needs.route.result }}
        run: bash nix/automation/verdict.sh
