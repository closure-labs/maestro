# SPDX-License-Identifier: Apache-2.0
name: Release Maestro

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Automatic uses conventional commits; override only when release impact differs
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: maestro-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Merge the release version through protected main
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Calculate and merge the release version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: github-actions
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:prepare

      - name: Dispatch immutable artifact resolution
        id: candidate
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:dispatch

  release:
    name: Verify and publish immutable release assets
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    concurrency:
      group: maestro-publication
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download tested installer state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: maestro-qualification-state
          path: candidate-state
          run-id: ${{ needs.prepare.outputs.run_id }}

      - name: Resolve immutable installer inventory
        id: inventory
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:inventory

      - name: Download tested installer inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: maestro-installer
          path: candidate
          run-id: ${{ steps.inventory.outputs.artifact_run_id }}

      - name: Verify builder checksums, state, and attestations
        env:
          ARTIFACT_RUN_ID: ${{ steps.inventory.outputs.artifact_run_id }}
          ARTIFACT_SOURCE_COMMIT: ${{ steps.inventory.outputs.artifact_source_commit }}
          MEDIA_INPUT: ${{ steps.inventory.outputs.media_input }}
          EVIDENCE_INPUT: ${{ steps.inventory.outputs.evidence_input }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:verify

      - name: Stage versioned release assets
        env:
          ARTIFACT_RUN_ID: ${{ steps.inventory.outputs.artifact_run_id }}
          ARTIFACT_SOURCE_COMMIT: ${{ steps.inventory.outputs.artifact_source_commit }}
          MEDIA_INPUT: ${{ steps.inventory.outputs.media_input }}
          EVIDENCE_INPUT: ${{ steps.inventory.outputs.evidence_input }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:stage

      - name: Create or refresh verified draft
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:draft

      - name: Attest final release filename
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/maestro-${{ needs.prepare.outputs.tag }}.iso

      - name: Bind SPDX SBOM to final release filename
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/maestro-${{ needs.prepare.outputs.tag }}.iso
          sbom-path: candidate/maestro-system.spdx.json

      - name: Publish versioned flake
        uses: DeterminateSystems/flakehub-push@e001ee821cdb763ef120c01f1048bfb2f938bb9c # main, Node.js 24 (post-v6)
        with:
          visibility: public
          name: closure-labs/maestro
          rolling: false
          tag: ${{ needs.prepare.outputs.tag }}
          rev: ${{ needs.prepare.outputs.source_sha }}
          include-output-paths: true

      - name: Publish immutable GitHub release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:publish

  advance:
    name: Merge the next development version
    needs:
      - prepare
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Merge next development version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: github-actions
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:advance
