# SPDX-License-Identifier: Apache-2.0
name: Security maintenance

on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      native_refresh:
        description: Refresh one exact immutable native inventory; no publication or risk acceptance
        type: boolean
        default: false
      native_run:
        description: Exact successful CI producer of the selected immutable native product
        type: string
        default: ''
      native_revision:
        description: Exact qualified product source SHA; empty retains current-main source selection
        type: string
        default: ''
      native_attempt:
        description: Exact original CI attempt
        type: string
        default: ''
      native_boot_run:
        description: Exact original executed-boot run if retained
        type: string
        default: ''
      native_boot_attempt:
        description: Exact original executed-boot attempt
        type: string
        default: ''
      native_boot_revision:
        description: Original executed-boot source SHA
        type: string
        default: ''
      native_official_tag:
        description: Optional exact native official release tag; requires its signed staging receipt and signer revision
        type: string
        default: ''
      native_official_publication_revision:
        description: Exact reviewed release signer SHA for native_official_tag
        type: string
        default: ''
      policy_only:
        description: Check GitHub policy without rescanning inventories
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-maintenance
  cancel-in-progress: false

jobs:
  native_refresh:
    name: Refresh exact native inventory without publication
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.native_refresh == true && inputs.policy_only != true) || github.event_name == 'schedule')
    outputs:
      verified_product: ${{ steps.refresh.outputs.verified_product }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Checkout protected scanner code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Restore original closure once and refresh independently fresh databases
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_OFFICIAL_RELEASE_TAG: ${{ inputs.native_official_tag }}
          NATIVE_OFFICIAL_PUBLICATION_REVISION: ${{ inputs.native_official_publication_revision }}
          NATIVE_REFRESH_SELECT_CURRENT_MAIN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          NATIVE_RUN: ${{ inputs.native_run }}
          NATIVE_ATTEMPT: ${{ inputs.native_attempt }}
          NATIVE_REVISION: ${{ inputs.native_revision || github.sha }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
          NATIVE_BOOT_ORIGIN_RUN: ${{ inputs.native_boot_run }}
          NATIVE_BOOT_ORIGIN_ATTEMPT: ${{ inputs.native_boot_attempt }}
          NATIVE_BOOT_ORIGIN_REVISION: ${{ inputs.native_boot_revision }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:refresh
      - name: Attest fresh health linked to original immutable evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: security-report/native-health.json
      - name: Retain fresh health without re-uploading original closure or inventories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-native-health
          path: security-report
          if-no-files-found: error
          retention-days: 30

  native_official_refresh:
    name: Refresh shipped native product once per invocation
    needs: native_refresh
    if: >-
      !cancelled() && github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' &&
      github.event_name == 'schedule' &&
      contains(fromJSON('["success","failure"]'), needs.native_refresh.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Checkout protected scanner code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Restore original closure once and refresh independently fresh databases
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_REFRESH_SELECT_OFFICIAL: 'true'
          NATIVE_REFRESH_REUSE_PRODUCT: ${{ needs.native_refresh.result == 'success' && needs.native_refresh.outputs.verified_product || '' }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:refresh
      - name: Attest fresh official health linked to original immutable evidence
        if: steps.refresh.outputs.reused != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: security-report/native-health.json
      - name: Retain fresh official health without re-uploading original inventories
        if: steps.refresh.outputs.reused != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.refresh.outputs.health_artifact }}
          path: security-report
          if-no-files-found: error
          retention-days: 30

  policy:
    name: Detect GitHub security policy drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Create read-only policy token
        id: policy-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SECAUDIT_CLIENTID }}
          private-key: ${{ secrets.SECAUDIT_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
      - name: Read repository security settings
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:security:policy-drift
