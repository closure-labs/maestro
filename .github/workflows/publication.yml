# SPDX-License-Identifier: Apache-2.0
name: Publish admitted Maestro candidate
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted main controller; downloaded candidates are data only.
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Completed protected candidate run; with proposal_hash use its exact fresh Security maintenance run
        type: string
        default: ''
      proposal_hash:
        description: Exact admitted official product for cache-only recovery; optional candidate_run supplies fresh observations
        type: string
        default: ''
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
concurrency:
  group: maestro-publication
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && contains(fromJSON('["push","schedule","workflow_dispatch","workflow_run"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: publication
    env:
      PUBLICATION_PURPOSE: ${{ inputs.proposal_hash != '' && 'release' || 'rolling' }}
    permissions:
      actions: read
      packages: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Download completed protected candidate data
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_METADATA_ONLY: 'true'
          CANDIDATE_RUN: ${{ inputs.candidate_run || '' }}
          CANDIDATE_PROPOSAL_HASH: ${{ inputs.proposal_hash || '' }}
          CANDIDATE_RELEASE_ONLY: ${{ inputs.proposal_hash != '' && 'true' || 'false' }}
          CANDIDATE_WORKFLOW: ${{ inputs.proposal_hash != '' && '.github/workflows/security.yml' || '.github/workflows/ci.yml' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:download
      - name: Create repository-scoped authority and journal token
        id: authority
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-administration: read
          permission-members: read
          permission-actions: read
      - name: Verify live admission and exact distribution roots
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:publication
      - name: Reserve exact official cache recovery identity
        if: inputs.proposal_hash != ''
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          PUBLICATION_KEY: ${{ steps.candidate.outputs.release_tag }}
          PUBLICATION_STEP: cache
          PUBLICATION_STATE: pending
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:journal
      - name: Mint independently scoped upstream authority reader
        id: upstream
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Inspect current public cache before closure materialization
        id: cache
        env:
          PUBLICATION_DESTINATION: cache
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:inspect
      - name: Restore authenticated qualified Nix closures without builders
        if: steps.cache.outputs.status != 'verified'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:distribution:restore
      - name: Verify pinned upstream handoff against actual appliance exposure
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:handoff
      - name: Publish verified realized closures
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          CACHIX_MAESTRO_AUTH_TOKEN: ${{ secrets.CACHIX_MAESTRO_AUTH_TOKEN }}
          CACHIX_MAESTRO_PUBKEY: ${{ vars.CACHIX_MAESTRO_PUBKEY }}
          PUBLICATION_CACHE_RECEIPT: ${{ runner.temp }}/cache-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:publish
      - name: Record freshly verified cache destination
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          PUBLICATION_KEY: ${{ inputs.proposal_hash != '' && steps.candidate.outputs.release_tag || '' }}
          PUBLICATION_STEP: cache
          PUBLICATION_STATE: complete
          PUBLICATION_RECEIPT: ${{ runner.temp }}/cache-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:journal
      - name: Inspect exact rolling FlakeHub destination
        if: inputs.proposal_hash == ''
        id: flakehub
        env:
          PUBLICATION_DESTINATION: flakehub
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:inspect
      - name: Recheck live admission before FlakeHub publication
        if: inputs.proposal_hash == ''
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          DECISION_REQUIRE_HANDOFF: 'true'
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:publication
      - name: Publish exact admitted rolling revision
        if: inputs.proposal_hash == '' && steps.flakehub.outputs.status != 'verified'
        uses: DeterminateSystems/flakehub-push@99ef15d19ce5deb24d62f5d1d6f5a81d9bf03567 # main, Node.js 24
        with:
          visibility: public
          name: closure-labs/maestro
          rolling: true
          rolling-minor: 2
          rev: ${{ steps.candidate.outputs.source_sha }}
          include-output-paths: true
      - name: Verify published rolling FlakeHub revision
        if: inputs.proposal_hash == ''
        env:
          PUBLICATION_DESTINATION: flakehub
          PUBLICATION_REQUIRE_VERIFIED: 'true'
          PUBLICATION_RECEIPT: ${{ runner.temp }}/flakehub-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:inspect
      - name: Record freshly verified rolling FlakeHub destination
        if: inputs.proposal_hash == ''
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          PUBLICATION_STEP: flakehub
          PUBLICATION_STATE: complete
          PUBLICATION_RECEIPT: ${{ runner.temp }}/flakehub-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:journal
