# SPDX-License-Identifier: Apache-2.0
name: Publish admitted Maestro candidate
on:
  workflow_dispatch:
    inputs:
      native_qualification_only:
        description: Read-only findings gate qualification; accepts no findings and never publishes
        type: boolean
        default: false
      native_run:
        description: Exact successful CI producer of the selected immutable native product
        type: string
        default: ''
      native_attempt:
        description: Exact native producer attempt
        type: string
        default: '1'
      native_revision:
        description: Full exact qualified product source SHA
        type: string
        default: ''
      native_health_run:
        description: Optional exact successful native Security maintenance refresh run
        type: string
        default: ''
      native_health_attempt:
        description: Exact refresh attempt when supplying native_health_run
        type: string
        default: ''
      native_boot_run:
        description: Exact original executed-boot run, when boot was retained
        type: string
        default: ''
      native_boot_attempt:
        description: Exact original executed-boot attempt
        type: string
        default: ''
      native_boot_revision:
        description: Full original executed-boot source SHA
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ inputs.native_qualification_only && 'maestro-publication-qualification' || 'maestro-publication' }}
  queue: max
  cancel-in-progress: false
jobs:
  native_review:
    if: (vars.MAESTRO_NATIVE_PUBLICATION_ENABLED == 'true' || inputs.native_qualification_only == true) && github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.native_run != '' && inputs.native_revision != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      context_sha256: ${{ steps.review.outputs.context_sha256 || steps.qualification_review.outputs.context_sha256 }}
    permissions:
      actions: read
      attestations: read
      pull-requests: read
      contents: read
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - name: Checkout protected native controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Prepare exact findings for explicit human risk review
        id: review
        if: inputs.native_qualification_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RISK_REVIEW_FILE: ${{ runner.temp }}/native-findings-review.json
          NATIVE_RESULT_FILE: ${{ runner.temp }}/native-findings-diagnostic.json
          MAESTRO_NATIVE_PUBLICATION_ENABLED: ${{ vars.MAESTRO_NATIVE_PUBLICATION_ENABLED }}
          NATIVE_RUN: ${{ inputs.native_run }}
          NATIVE_HEALTH_RUN: ${{ inputs.native_health_run }}
          NATIVE_HEALTH_ATTEMPT: ${{ inputs.native_health_attempt }}
          NATIVE_ATTEMPT: ${{ inputs.native_attempt }}
          NATIVE_REVISION: ${{ inputs.native_revision }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
          NATIVE_BOOT_ORIGIN_RUN: ${{ inputs.native_boot_run }}
          NATIVE_BOOT_ORIGIN_ATTEMPT: ${{ inputs.native_boot_attempt }}
          NATIVE_BOOT_ORIGIN_REVISION: ${{ inputs.native_boot_revision }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:review
      - name: Prepare read-only qualification context; accept no findings
        id: qualification_review
        if: inputs.native_qualification_only == true
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RISK_REVIEW_FILE: ${{ runner.temp }}/native-findings-review.json
          NATIVE_RESULT_FILE: ${{ runner.temp }}/native-findings-diagnostic.json
          MAESTRO_NATIVE_PUBLICATION_ENABLED: ${{ vars.MAESTRO_NATIVE_PUBLICATION_ENABLED }}
          NATIVE_RUN: ${{ inputs.native_run }}
          NATIVE_HEALTH_RUN: ${{ inputs.native_health_run }}
          NATIVE_HEALTH_ATTEMPT: ${{ inputs.native_health_attempt }}
          NATIVE_ATTEMPT: ${{ inputs.native_attempt }}
          NATIVE_REVISION: ${{ inputs.native_revision }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
          NATIVE_BOOT_ORIGIN_RUN: ${{ inputs.native_boot_run }}
          NATIVE_BOOT_ORIGIN_ATTEMPT: ${{ inputs.native_boot_attempt }}
          NATIVE_BOOT_ORIGIN_REVISION: ${{ inputs.native_boot_revision }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:review-qualification
      - name: Retain bounded native consumer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-findings-review
          path: |
            ${{ runner.temp }}/native-findings-review.json
            ${{ runner.temp }}/native-findings-diagnostic.json
          if-no-files-found: error
          retention-days: 30

  native_publish:
    needs: native_review
    if: inputs.native_qualification_only != true && vars.MAESTRO_NATIVE_PUBLICATION_ENABLED == 'true' && github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.native_run != '' && inputs.native_revision != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: findings-risk-review
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary
    permissions:
      actions: read
      attestations: read
      pull-requests: read
      contents: read
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - name: Checkout protected native controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Enforce native policy before any restore or selected cache write
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_FINDINGS_CONTEXT_SHA256: ${{ needs.native_review.outputs.context_sha256 }}
          NATIVE_RESULT_FILE: ${{ runner.temp }}/native-publication-result.json
          MAESTRO_NATIVE_PUBLICATION_ENABLED: ${{ vars.MAESTRO_NATIVE_PUBLICATION_ENABLED }}
          NATIVE_RUN: ${{ inputs.native_run }}
          NATIVE_HEALTH_RUN: ${{ inputs.native_health_run }}
          NATIVE_HEALTH_ATTEMPT: ${{ inputs.native_health_attempt }}
          NATIVE_ATTEMPT: ${{ inputs.native_attempt }}
          NATIVE_REVISION: ${{ inputs.native_revision }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
          NATIVE_BOOT_ORIGIN_RUN: ${{ inputs.native_boot_run }}
          NATIVE_BOOT_ORIGIN_ATTEMPT: ${{ inputs.native_boot_attempt }}
          NATIVE_BOOT_ORIGIN_REVISION: ${{ inputs.native_boot_revision }}
          CACHIX_MAESTRO_AUTH_TOKEN: ${{ secrets.CACHIX_MAESTRO_AUTH_TOKEN }}
          CACHIX_MAESTRO_PUBKEY: ${{ vars.CACHIX_MAESTRO_PUBKEY }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:publication
      - name: Retain bounded native consumer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-native-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-publication-result.json
          if-no-files-found: ignore
          retention-days: 30

  native_qualify:
    needs: native_review
    if: inputs.native_qualification_only == true && github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.native_run != '' && inputs.native_revision != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: findings-risk-review
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary
    permissions:
      actions: read
      attestations: read
      pull-requests: read
      contents: read
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - name: Checkout protected native controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Verify gate mechanics without accepting risk or writing a destination
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_FINDINGS_CONTEXT_SHA256: ${{ needs.native_review.outputs.context_sha256 }}
          NATIVE_RESULT_FILE: ${{ runner.temp }}/native-qualification-result.json
          MAESTRO_NATIVE_PUBLICATION_ENABLED: ${{ vars.MAESTRO_NATIVE_PUBLICATION_ENABLED }}
          NATIVE_RUN: ${{ inputs.native_run }}
          NATIVE_HEALTH_RUN: ${{ inputs.native_health_run }}
          NATIVE_HEALTH_ATTEMPT: ${{ inputs.native_health_attempt }}
          NATIVE_ATTEMPT: ${{ inputs.native_attempt }}
          NATIVE_REVISION: ${{ inputs.native_revision }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
          NATIVE_BOOT_ORIGIN_RUN: ${{ inputs.native_boot_run }}
          NATIVE_BOOT_ORIGIN_ATTEMPT: ${{ inputs.native_boot_attempt }}
          NATIVE_BOOT_ORIGIN_REVISION: ${{ inputs.native_boot_revision }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:qualify
      - name: Retain bounded native consumer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-native-gate-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-qualification-result.json
          if-no-files-found: ignore
          retention-days: 30
