# SPDX-License-Identifier: Apache-2.0
name: Update Nix flake inputs

on:
  schedule:
    - cron: "17 9 * * 3"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    name: Refresh every locked input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Refresh native and flake inputs
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' automation:update-locks

      - name: Validate the synchronized lockfiles
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' automation:validate-locks

      - name: Open one allowlisted lock-file pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BODY: |
            Automated weekly refresh of every locked flake and devenv input.

            Required validation and protected-branch policy still apply.
          UPDATE_BRANCH: automation/weekly-flake-input-refresh
          UPDATE_TITLE: "locks: refresh Nix and devenv inputs"
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' automation:open-lock-update-pr
