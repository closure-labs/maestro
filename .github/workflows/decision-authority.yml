# SPDX-License-Identifier: Apache-2.0
name: Verify maintainer decision authority
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Metadata signal only; never execute triggering code.
    workflows: [Collect maintainer decision events]
    types: [completed]
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: maestro-authority-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  authority:
    if: github.repository == 'closure-labs/maestro' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Mint narrowly scoped authority-check token
        id: authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-actions: read
          permission-administration: read
          permission-members: read
      - name: Authenticate exact reviewed content and report App-bound check
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          COLLECTOR_RUN: ${{ github.event.workflow_run.id }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:check
      - name: Retain immutable decision byte reuse observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-decision-byte-reuse-${{ github.job }}
          path: ${{ runner.temp }}/decision-git-blobs/*/observations.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain bounded recovery verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-security-recovery-receipts
          path: ${{ runner.temp }}/security-recovery-*/receipt.json
          if-no-files-found: ignore
          retention-days: 30
