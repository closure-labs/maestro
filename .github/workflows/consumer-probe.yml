# SPDX-License-Identifier: Apache-2.0
name: Public consumer verification
on:
  schedule:
    - cron: "23 10 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-consumer-verification
  cancel-in-progress: false
jobs:
  consumer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout protected consumer code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Verify public downloads and signatures in a disposable store
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:consumer-probe
      - name: Retain exact public consumer result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-public-consumer-result
          path: ${{ runner.temp }}/public-consumer-result.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain immutable decision byte reuse observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-decision-byte-reuse-${{ github.job }}
          path: ${{ runner.temp }}/decision-git-blobs/*/observations.jsonl
          if-no-files-found: ignore
          retention-days: 30
