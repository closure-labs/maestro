# SPDX-License-Identifier: Apache-2.0
name: Public consumer verification
on:
  schedule:
    - cron: "23 10 * * 0"
  workflow_dispatch:
    inputs:
      native_run:
        description: Optional exact CI producer; empty verifies the latest official release
        type: string
        default: ''
      native_attempt:
        description: Exact producer attempt
        type: string
        default: '1'
      native_revision:
        description: Full exact qualified product source SHA
        type: string
        default: ''
      native_health_run:
        description: Optional exact successful native Security maintenance refresh run
        type: string
        default: ''
      native_health_attempt:
        description: Exact refresh attempt when supplying native_health_run
        type: string
        default: ''
      native_boot_run:
        description: Exact original executed-boot run
        type: string
        default: ''
      native_boot_attempt:
        description: Exact original executed-boot attempt
        type: string
        default: ''
      native_boot_revision:
        description: Full original executed-boot source SHA
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: public-consumer-verification
  cancel-in-progress: false
jobs:
  official_consumer:
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.native_run == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout protected official consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Verify signed official release assets and cold public cache bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RESULT_FILE: ${{ runner.temp }}/native-public-consumer-result.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:public-probe
      - name: Retain bounded integrity-only consumer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-native-public-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-public-consumer-result.json
          if-no-files-found: ignore
          retention-days: 30

  native_consumer:
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.native_run != '' && inputs.native_revision != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      attestations: read
      pull-requests: read
      contents: read
    steps:
      - name: Checkout protected native consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Verify exact native policy and cold selected public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RESULT_FILE: ${{ runner.temp }}/native-publication-result.json
          NATIVE_RUN: ${{ inputs.native_run }}
          NATIVE_HEALTH_RUN: ${{ inputs.native_health_run }}
          NATIVE_HEALTH_ATTEMPT: ${{ inputs.native_health_attempt }}
          NATIVE_ATTEMPT: ${{ inputs.native_attempt }}
          NATIVE_REVISION: ${{ inputs.native_revision }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
          NATIVE_BOOT_ORIGIN_RUN: ${{ inputs.native_boot_run }}
          NATIVE_BOOT_ORIGIN_ATTEMPT: ${{ inputs.native_boot_attempt }}
          NATIVE_BOOT_ORIGIN_REVISION: ${{ inputs.native_boot_revision }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:native:probe
      - name: Retain bounded native consumer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-native-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-publication-result.json
          if-no-files-found: ignore
          retention-days: 30
