# SPDX-License-Identifier: Apache-2.0
name: Queue trusted automation updates

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: queue-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enqueue:
    if: github.ref == 'refs/heads/main'
    name: Validate and enqueue trusted updates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: $/.github/actions/setup-nix

      - name: Verify, validate, and enqueue updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_QUEUE_PAT: ${{ secrets.MERGE_QUEUE_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' automation:queue
