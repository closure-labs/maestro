# SPDX-License-Identifier: Apache-2.0
# maestro-codeql-findings-protocol: 1
name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '37 21 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  analyze:
    name: ${{ matrix.language == 'actions' && 'Scan (actions)' || format('Analyze ({0})', matrix.language) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - name: Audit hosted runner egress
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout candidate as analysis data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout protected scanner toolchain
        if: matrix.language == 'rust'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: controller
          persist-credentials: false
      - name: Set up native Nix for Rust analysis
        if: matrix.language == 'rust'
        uses: ./controller/.github/actions/setup-nix # zizmor: ignore[self-repository] -- protected base/main toolchain, never candidate setup code.
      - name: Select the pinned native Rust toolchain
        if: matrix.language == 'rust'
        working-directory: controller
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:codeql:rust-toolchain
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          source-root: candidate
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results
      - name: Retain CodeQL results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 30

  findings_verdict:
    # Start immediately, not after scan completion: this existing required
    # context must be pending throughout a same-SHA rerun.
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout protected findings verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
      - name: Set up native verifier
        uses: $/.github/actions/setup-nix
      - name: Require this scan attempt and current human findings decision
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:codeql:verdict

  publish:
    name: Publish protected-main CodeQL results
    needs: [analyze, findings_verdict]
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - name: Download this run's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_attempt }}
          path: codeql-results
      - name: Upload protected-main analysis
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          checkout_path: candidate
          sarif_file: codeql-results
          category: /language:${{ matrix.language }}
