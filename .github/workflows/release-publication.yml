# SPDX-License-Identifier: Apache-2.0
name: Publish approved Maestro release
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Completed prepared release or refreshed release evidence producer
        type: string
        default: ''
      transaction_trial:
        description: Verified-only transaction comparison; requires an explicit candidate_run
        type: choice
        default: default
        options: [default, disabled, enabled]
  push:
    branches: [main]
    paths: ['automation/decisions/**']
  schedule:
    - cron: '43 * * * *'
permissions:
  contents: read
concurrency:
  group: maestro-publication
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.transaction_trial == 'default' || inputs.transaction_trial == '' || inputs.candidate_run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release
    env:
      MAESTRO_CI_DIAGNOSTICS: 'true'
      MAESTRO_RELEASE_VERIFICATION_REUSE_ENABLED: ${{ vars.MAESTRO_RELEASE_VERIFICATION_REUSE_ENABLED || 'false' }}
      MAESTRO_PACKET_METADATA_REUSE_ENABLED: ${{ vars.MAESTRO_PACKET_METADATA_REUSE_ENABLED || 'false' }}
      MAESTRO_RELEASE_TRANSACTION_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.transaction_trial == 'enabled') && 'true' || (github.event_name == 'workflow_dispatch' && inputs.transaction_trial == 'disabled') && 'false' || vars.MAESTRO_RELEASE_TRANSACTION_ENABLED || 'false' }}
      PUBLICATION_REQUIRE_VERIFIED: ${{ (github.event_name == 'workflow_dispatch' && (inputs.transaction_trial == 'enabled' || inputs.transaction_trial == 'disabled')) && 'true' || 'false' }}
      MAESTRO_PACKET_METADATA_BATCH_ENABLED: ${{ vars.MAESTRO_PACKET_METADATA_BATCH_ENABLED || 'false' }}
    permissions:
      actions: read
      packages: read
      contents: write
      id-token: write
      attestations: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Resolve retained exact release product
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_METADATA_ONLY: 'true'
          CANDIDATE_RUN: ${{ inputs.candidate_run || '' }}
          CANDIDATE_RELEASE_ONLY: 'true'
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' ci:decision:download
      - name: Mint repository-scoped live authority and journal token
        id: authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-members: read
          permission-administration: read
          permission-actions: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
      - name: Mint independently scoped upstream authority reader
        id: upstream
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Inspect current public cache before closure materialization
        id: cache
        env:
          PUBLICATION_DESTINATION: cache
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:inspect
      - name: Restore authenticated qualified Nix closures without builders
        if: env.PUBLICATION_REQUIRE_VERIFIED != 'true' && steps.cache.outputs.status != 'verified'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          PUBLICATION_PURPOSE: release
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:distribution:restore
      - name: Verify current upstream handoff and downstream exposure
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:handoff
      - name: Reserve exact approved release identity
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          PUBLICATION_PURPOSE: release
          PUBLICATION_KEY: ${{ steps.candidate.outputs.release_tag }}
          PUBLICATION_STEP: github
          PUBLICATION_STATE: pending
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:journal
      - name: Reserve journal tag and draft as one authorized group
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:reserve
      - name: Mint fresh asset authority token
        id: assets-authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-members: read
          permission-administration: read
          permission-actions: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
      - name: Mint fresh asset upstream reader
        id: assets-upstream
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Reconcile and publish exact approved hosted bytes
        env:
          GH_TOKEN: ${{ steps.assets-authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.assets-upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PUBLICATION_PUBLISH: ${{ env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true' && 'false' || 'true' }}
          PUBLICATION_STAGE_ONLY: ${{ env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true' && 'true' || 'false' }}
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:assets
      - name: Mint fresh completion authority token
        id: completion-authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-members: read
          permission-administration: read
          permission-actions: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
      - name: Mint fresh completion upstream reader
        id: completion-upstream
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Record verified immutable GitHub publication
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          PUBLICATION_PURPOSE: release
          PUBLICATION_KEY: ${{ steps.candidate.outputs.release_tag }}
          PUBLICATION_STEP: github
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-receipt.json
          PUBLICATION_STATE: complete
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:journal
      - name: Verify publish and journal GitHub completion as one authorized group
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.completion-upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:complete
      - name: Inspect exact versioned FlakeHub destination
        id: flakehub
        env:
          PUBLICATION_DESTINATION: flakehub
          PUBLICATION_PURPOSE: release
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:inspect
      - name: Recheck current admission and release approval
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.completion-upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          DECISION_REQUIRE_HANDOFF: 'true'
          PUBLICATION_PURPOSE: release
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' ci:decision:publication
      - name: Publish the approved versioned flake
        if: env.PUBLICATION_REQUIRE_VERIFIED != 'true' && steps.flakehub.outputs.status != 'verified'
        uses: DeterminateSystems/flakehub-push@dceefcb33cba27bde28f8540d8b4537cb925c46b # main, Node.js 24
        with:
          visibility: public
          name: closure-labs/maestro
          rolling: false
          tag: ${{ steps.candidate.outputs.release_tag }}
          rev: ${{ steps.candidate.outputs.source_sha }}
          include-output-paths: true
      - name: Verify current versioned FlakeHub identity
        env:
          PUBLICATION_DESTINATION: flakehub
          PUBLICATION_PURPOSE: release
          PUBLICATION_REQUIRE_VERIFIED: 'true'
          PUBLICATION_RECEIPT: ${{ runner.temp }}/flakehub-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:inspect
      - name: Record versioned FlakeHub publication
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          PUBLICATION_PURPOSE: release
          PUBLICATION_KEY: ${{ steps.candidate.outputs.release_tag }}
          PUBLICATION_STEP: flakehub
          PUBLICATION_RECEIPT: ${{ runner.temp }}/flakehub-receipt.json
          PUBLICATION_STATE: complete
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:journal
      - name: Advance development through protected main
        if: env.PUBLICATION_REQUIRE_VERIFIED != 'true'
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ steps.completion-authority.outputs.token }}
          DEFAULT_BRANCH: main
          EXPECTED_AUTHOR: cl-decider
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:advance
      - name: Bind publication diagnostics to this execution
        if: always()
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:diagnostics
      - name: Retain complete publication diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-publication-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-diagnostics/
          if-no-files-found: error
          retention-days: 30
