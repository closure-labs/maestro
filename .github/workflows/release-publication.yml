# SPDX-License-Identifier: Apache-2.0
name: Publish approved Maestro release
on:
  workflow_dispatch:
    inputs:
      native_release:
        description: Opt-in native versioned release; requires separately enabled flag and fresh explicit findings-risk approval
        type: boolean
        default: false
      native_run:
        description: Exact successful CI producer of the selected immutable native product
        type: string
        default: ''
      native_attempt:
        description: Exact native producer attempt
        type: string
        default: '1'
      native_revision:
        description: Full exact qualified product source SHA
        type: string
        default: ''
      native_health_run:
        description: Optional exact successful native Security maintenance refresh run
        type: string
        default: ''
      native_health_attempt:
        description: Exact refresh attempt when supplying native_health_run
        type: string
        default: ''
      native_boot_run:
        description: Exact original executed-boot run, when boot was retained
        type: string
        default: ''
      native_boot_attempt:
        description: Exact original executed-boot attempt
        type: string
        default: ''
      native_boot_revision:
        description: Full original executed-boot source SHA
        type: string
        default: ''
      candidate_run:
        description: Completed prepared release or refreshed release evidence producer
        type: string
        default: ''
      transaction_trial:
        description: Verified-only transaction comparison; requires an explicit candidate_run
        type: choice
        default: default
        options: [default, disabled, enabled]
  push:
    branches: [main]
    paths: ['automation/decisions/**']
  schedule:
    - cron: '43 * * * *'
permissions:
  contents: read
concurrency:
  group: maestro-publication
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    if: vars.MAESTRO_NATIVE_RELEASE_ENABLED != 'true' && inputs.native_release != true && github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.transaction_trial == 'default' || inputs.transaction_trial == '' || inputs.candidate_run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release
    env:
      MAESTRO_CI_DIAGNOSTICS: 'true'
      MAESTRO_RELEASE_VERIFICATION_REUSE_ENABLED: ${{ vars.MAESTRO_RELEASE_VERIFICATION_REUSE_ENABLED || 'false' }}
      MAESTRO_PACKET_METADATA_REUSE_ENABLED: ${{ vars.MAESTRO_PACKET_METADATA_REUSE_ENABLED || 'false' }}
      MAESTRO_RELEASE_TRANSACTION_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.transaction_trial == 'enabled') && 'true' || (github.event_name == 'workflow_dispatch' && inputs.transaction_trial == 'disabled') && 'false' || vars.MAESTRO_RELEASE_TRANSACTION_ENABLED || 'false' }}
      PUBLICATION_REQUIRE_VERIFIED: ${{ (github.event_name == 'workflow_dispatch' && (inputs.transaction_trial == 'enabled' || inputs.transaction_trial == 'disabled')) && 'true' || 'false' }}
      MAESTRO_PACKET_METADATA_BATCH_ENABLED: ${{ vars.MAESTRO_PACKET_METADATA_BATCH_ENABLED || 'false' }}
    permissions:
      actions: read
      packages: read
      contents: write
      attestations: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Resolve retained exact release product
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_METADATA_ONLY: 'true'
          CANDIDATE_RUN: ${{ inputs.candidate_run || '' }}
          CANDIDATE_RELEASE_ONLY: 'true'
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' ci:decision:download
      - name: Reject locally unusable health before public inspection
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:health-preflight
      - name: Mint repository-scoped live authority and journal token
        id: authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-members: read
          permission-administration: read
          permission-actions: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
      - name: Mint independently scoped upstream authority reader
        id: upstream
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Inspect current public cache before closure materialization
        id: cache
        env:
          PUBLICATION_DESTINATION: cache
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:inspect
      - name: Restore authenticated qualified Nix closures without builders
        if: env.PUBLICATION_REQUIRE_VERIFIED != 'true' && steps.cache.outputs.status != 'verified'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          PUBLICATION_PURPOSE: release
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:distribution:restore
      - name: Verify current upstream handoff and downstream exposure
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:handoff
      - name: Reserve exact approved release identity
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          PUBLICATION_PURPOSE: release
          PUBLICATION_KEY: ${{ steps.candidate.outputs.release_tag }}
          PUBLICATION_STEP: github
          PUBLICATION_STATE: pending
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:journal
      - name: Reserve journal tag and draft as one authorized group
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:reserve
      - name: Mint fresh asset authority token
        id: assets-authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-members: read
          permission-administration: read
          permission-actions: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
      - name: Mint fresh asset upstream reader
        id: assets-upstream
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Reconcile and publish exact approved hosted bytes
        env:
          GH_TOKEN: ${{ steps.assets-authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.assets-upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PUBLICATION_PUBLISH: ${{ env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true' && 'false' || 'true' }}
          PUBLICATION_STAGE_ONLY: ${{ env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true' && 'true' || 'false' }}
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:assets
      - name: Mint fresh completion authority token
        id: completion-authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
          permission-members: read
          permission-administration: read
          permission-actions: ${{ env.PUBLICATION_REQUIRE_VERIFIED == 'true' && 'read' || 'write' }}
      - name: Mint fresh completion upstream reader
        id: completion-upstream
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: read
          permission-pull-requests: read
          permission-members: read
          permission-administration: read
          permission-actions: read
      - name: Record verified immutable GitHub publication
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          PUBLICATION_PURPOSE: release
          PUBLICATION_KEY: ${{ steps.candidate.outputs.release_tag }}
          PUBLICATION_STEP: github
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-receipt.json
          PUBLICATION_STATE: complete
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --show-output --option 'packages:pkgs!' '' release:journal
      - name: Verify publish and journal GitHub completion as one authorized group
        if: env.MAESTRO_RELEASE_TRANSACTION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          XO_AUTHORITY_TOKEN: ${{ steps.completion-upstream.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-receipt.json
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:complete
      - name: Advance development through protected main
        if: env.PUBLICATION_REQUIRE_VERIFIED != 'true'
        env:
          GH_TOKEN: ${{ steps.completion-authority.outputs.token }}
          MERGE_QUEUE_TOKEN: ${{ steps.completion-authority.outputs.token }}
          DEFAULT_BRANCH: main
          EXPECTED_AUTHOR: cl-decider
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:advance
      - name: Bind publication diagnostics to this execution
        if: always()
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:diagnostics
      - name: Retain complete publication diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-publication-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-diagnostics/
          if-no-files-found: error
          retention-days: 30

  native_review:
    if: vars.MAESTRO_NATIVE_RELEASE_ENABLED == 'true' && inputs.native_release == true && github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.native_run != '' && inputs.native_revision != '' && inputs.candidate_run == '' && (inputs.transaction_trial == 'default' || inputs.transaction_trial == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      context_sha256: ${{ steps.review.outputs.context_sha256 }}
      version: ${{ steps.review.outputs.release_version }}
      media_artifact_id: ${{ steps.review.outputs.media_artifact_id }}
      media_run: ${{ steps.review.outputs.media_run }}
      media_attempt: ${{ steps.review.outputs.media_attempt }}
      media_revision: ${{ steps.review.outputs.media_revision }}
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout protected native controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Nix
        uses: $/.github/actions/setup-nix
      - name: Prepare exact findings for explicit human risk review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RISK_REVIEW_FILE: ${{ runner.temp }}/native-findings-review.json
          NATIVE_RUN: ${{ inputs.native_run }}
          NATIVE_HEALTH_RUN: ${{ inputs.native_health_run }}
          NATIVE_HEALTH_ATTEMPT: ${{ inputs.native_health_attempt }}
          NATIVE_ATTEMPT: ${{ inputs.native_attempt }}
          NATIVE_REVISION: ${{ inputs.native_revision }}
          NATIVE_POLICY_REVISION: ${{ github.sha }}
          NATIVE_BOOT_ORIGIN_RUN: ${{ inputs.native_boot_run }}
          NATIVE_BOOT_ORIGIN_ATTEMPT: ${{ inputs.native_boot_attempt }}
          NATIVE_BOOT_ORIGIN_REVISION: ${{ inputs.native_boot_revision }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:native:review
      - name: Retain bounded native consumer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-findings-review
          path: ${{ runner.temp }}/native-findings-review.json
          if-no-files-found: error
          retention-days: 30

  native_publish:
    needs: native_review
    if: needs.native_review.result == 'success' && vars.MAESTRO_NATIVE_RELEASE_ENABLED == 'true' && inputs.native_release == true && github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    # Preserve the already-pinned release.yml attestation signer. No App key is passed.
    uses: $/.github/workflows/release.yml
    with:
      release_request_run_id: ''
      release_candidate_run_id: ''
      native_release: true
      native_context_sha256: ${{ needs.native_review.outputs.context_sha256 }}
      native_version: ${{ needs.native_review.outputs.version }}
      native_media_artifact_id: ${{ needs.native_review.outputs.media_artifact_id }}
      native_media_run: ${{ needs.native_review.outputs.media_run }}
      native_media_attempt: ${{ needs.native_review.outputs.media_attempt }}
      native_media_revision: ${{ needs.native_review.outputs.media_revision }}
      native_run: ${{ inputs.native_run }}
      native_attempt: ${{ inputs.native_attempt }}
      native_revision: ${{ inputs.native_revision }}
      native_health_run: ${{ inputs.native_health_run }}
      native_health_attempt: ${{ inputs.native_health_attempt }}
      native_boot_run: ${{ inputs.native_boot_run }}
      native_boot_attempt: ${{ inputs.native_boot_attempt }}
      native_boot_revision: ${{ inputs.native_boot_revision }}
