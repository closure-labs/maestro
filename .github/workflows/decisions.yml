# SPDX-License-Identifier: Apache-2.0
name: Reconcile maintainer decisions
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted main validates completed native producers independently.
    workflows: [CI, Security maintenance, Release Maestro, Continue Maestro release]
    types: [completed]
  push:
    branches: [main]
    paths: ['automation/decisions/**']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Completed protected native producer; empty discovers retained evidence
        type: string
        default: ''
      proposal_hash:
        description: Exact admitted official product; pair candidate_run with its fresh Security maintenance observations
        type: string
        default: ''
      kind:
        type: choice
        options: [security-findings, release-product]
        default: security-findings
permissions:
  contents: read
  actions: read
concurrency:
  group: maestro-decision-reconciliation
  cancel-in-progress: false
jobs:
  health:
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && contains(fromJSON('["push","schedule","workflow_dispatch","workflow_run"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Mint scoped health reporter
        id: health
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-issues: write
      - name: Reconcile audit and human decision health
        env:
          GH_TOKEN: ${{ steps.health.outputs.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:health
      - name: Retain immutable decision byte reuse observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-decision-byte-reuse-${{ github.job }}
          path: ${{ runner.temp }}/decision-git-blobs/*/observations.jsonl
          if-no-files-found: ignore
          retention-days: 30

  reconcile:
    permissions:
      contents: read
      actions: read
      packages: write
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && contains(fromJSON('["push","schedule","workflow_dispatch","workflow_run"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Resolve immutable completed producer data
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run || '' }}
          CANDIDATE_PROPOSAL_HASH: ${{ inputs.proposal_hash || '' }}
          PUBLICATION_METADATA_ONLY: ${{ inputs.proposal_hash != '' && 'true' || 'false' }}
          CANDIDATE_RELEASE_ONLY: ${{ inputs.proposal_hash != '' && 'true' || 'false' }}
          CANDIDATE_WORKFLOW: ${{ inputs.proposal_hash != '' && '.github/workflows/security.yml' || '' }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:download
      - name: Mint scoped proposal-author token
        id: proposer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-administration: read
          permission-members: read
      - name: Propose uncovered findings from complete authenticated evidence
        env:
          GH_TOKEN: ${{ steps.proposer.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          DECISION_KIND: security-findings
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:reconcile
      - name: Propose approval of exact official product bytes
        if: steps.candidate.outputs.release == 'true' || inputs.kind == 'release-product'
        env:
          GH_TOKEN: ${{ steps.proposer.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          DECISION_KIND: release-product
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:reconcile
      - name: Retain immutable decision byte reuse observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-decision-byte-reuse-${{ github.job }}
          path: ${{ runner.temp }}/decision-git-blobs/*/observations.jsonl
          if-no-files-found: ignore
          retention-days: 30
