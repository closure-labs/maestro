# SPDX-License-Identifier: Apache-2.0
name: Report maintainer decision health
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted main validates completed native producers independently.
    workflows: [CI, Security maintenance, Release Maestro]
    types: [completed]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: maestro-decision-reconciliation
  cancel-in-progress: false
jobs:
  health:
    if: github.repository == 'closure-labs/maestro' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && contains(fromJSON('["push","schedule","workflow_dispatch","workflow_run"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Mint scoped health reporter
        id: health
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-issues: write
      - name: Reconcile audit and human decision health
        env:
          GH_TOKEN: ${{ steps.health.outputs.token }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' ci:decision:health
      - name: Retain immutable decision byte reuse observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-decision-byte-reuse-${{ github.job }}
          path: ${{ runner.temp }}/decision-git-blobs/*/observations.jsonl
          if-no-files-found: ignore
          retention-days: 30
