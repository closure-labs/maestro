[project]
name = "maestro"
revision = "1.0"
require_reason = "agents"

[providers]
github-repository = "env"
github-organization = "env"

[profiles.default]
SECAUDIT_CLIENTID = { description = "Organization GitHub App client ID used to mint repository-scoped security policy read tokens", required = false, providers = ["github-organization"] }
SECAUDIT_PEM = { description = "Organization GitHub App private key consumed only by the pinned token action at runtime", required = false, providers = ["github-organization"] }
CACHIX_AUTH_TOKEN = { description = "Cachix write token supplied by the GitHub Actions secret of the same name", required = false, providers = ["github-repository"] }
CACHIX_CACHE_NAME = { description = "Temporary legacy Cachix cache supplied by the GitHub repository variable of the same name", default = "nixoa", providers = ["github-repository"] }

[profiles.github]
CACHIX_AUTH_TOKEN = { required = false }
CACHIX_CACHE_NAME = {}

[profiles.github-publish]
CACHIX_AUTH_TOKEN = { required = true }
CACHIX_CACHE_NAME = {}

[profiles.github-policy]
SECAUDIT_CLIENTID = { required = true }
SECAUDIT_PEM = { required = true }

[scopes.cachix]
secrets = ["CACHIX_AUTH_TOKEN", "CACHIX_CACHE_NAME"]
