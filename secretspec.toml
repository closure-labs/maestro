[project]
name = "maestro"
revision = "1.0"
require_reason = "agents"

[providers]
# GitHub supplies Actions secrets/variables through the job environment; its
# REST API exposes secret metadata, not the values needed by local processes.
github-repository = "env"
github-organization = "env"
xcp-runtime = "env"
workstation-pass = "pass"

[profiles.default]
MAESTRO_DECISION_ONLY_REUSE_ENABLED = { description = "Reviewed decision-only retained-evidence experiment; supplies no approval or authority", required = false, default = "false", providers = ["github-repository"] }
MAESTRO_RELEASE_VERIFICATION_REUSE_ENABLED = { description = "Gate-local immutable verification reuse; live authority remains fresh for every write group", required = false, default = "false", providers = ["github-repository"] }
MAESTRO_PACKET_METADATA_BATCH_ENABLED = { description = "Reviewed handoff metadata batching experiment; immutable bytes only, supplies no approval or authority", required = false, default = "false", providers = ["github-repository"] }
MAESTRO_PUBLIC_CACHE_TRANSPORT_REUSE_ENABLED = { description = "Disabled public metadata connection-reuse experiment with a shared two-request budget; supplies no approval or authority", required = false, default = "false", providers = ["github-repository"] }
MAESTRO_READONLY_PUBLICATION_PREFLIGHT_ENABLED = { description = "Reviewed read-only publication preflight experiment; supplies no approval or authority", required = false, default = "false", providers = ["github-repository"] }
# Only public values may be inherited by native Devenv evaluation.
MAESTRO_RELEASE_CONTINUATION_ENABLED = { description = "Reviewed event-driven release pilot enable variable; default remains disabled", required = false, default = "false", providers = ["github-repository"] }
MAESTRO_RELEASE_RETIRED_REQUEST_RUN_IDS = { description = "JSON array of up to 16 unique positive retired unpublished request run IDs; preserves immutable journals and logs", required = false, default = "[]", providers = ["github-repository"] }
CACHIX_MAESTRO_PUBKEY = { description = "Public signing key for https://maestro.cachix.org, supplied by the GitHub repository variable and checked against the reviewed cache configuration", default = "maestro.cachix.org-1:fGFZFVwe2ZHEBENWZLHVzERZrz2c50ru+g0UewH68I0=", providers = ["github-repository"] }

[profiles.development]
# Inherits public defaults only; the built-in Cachix token has a separate namespace.

[profiles.runtime]
# Optional runtime contracts previously declared in the default profile.
DECIDER_CLIENT = { description = "Human decision GitHub App client ID; resolve only at runtime", required = false, providers = ["github-organization"] }
DECIDER_KEY = { description = "GitHub App private key, consumed only by the pinned token action", required = false, providers = ["github-organization"] }
DECIDER_APP_ID = { description = "Public App integration ID mirrored in reviewed decision policy and main ruleset", required = false, providers = ["github-organization"] }
REGISTRY_TOKEN = { description = "Short-lived Actions package token for the dedicated immutable decision evidence registry", required = false, providers = ["github-repository"] }
XO_AUTHORITY_TOKEN = { description = "Short-lived App reader scoped independently to xo-nixpkg for live upstream handoff authority", required = false, providers = ["github-organization"] }
XCP_HOSTPASSWORD = { description = "SecretOps runtime XCP-ng API password; never available to Nix evaluation or stored Packer variables", required = false, providers = ["xcp-runtime"] }
XCP_PASSWORD_PASS_ENTRY = { description = "Password-store entry resolved at deployment runtime, for example /VatesTrainingLab/hostpassword", required = false, providers = ["xcp-runtime"] }
SECAUDIT_CLIENTID = { description = "Organization GitHub App client ID used to mint repository-scoped security policy read tokens", required = false, providers = ["github-organization"] }
SECAUDIT_PEM = { description = "Organization GitHub App private key consumed only by the pinned token action at runtime for repository-scoped Administration read access", required = false, providers = ["github-organization"] }
MERGE_QUEUE_TOKEN = { description = "Short-lived repository-scoped GitHub App token for protected queue admission; minted at runtime, never stored as a personal token", required = false, providers = ["github-organization", "github-repository"] }
CACHIX_MAESTRO_AUTH_TOKEN = { description = "Maestro Cachix write token from the GitHub repository secret or workstation pass; mapped to Cachix only at publication runtime", required = false, providers = ["github-repository"] }

[profiles.github]
CACHIX_MAESTRO_AUTH_TOKEN = { description = "Maestro Cachix write token from the GitHub repository secret or workstation pass; mapped to Cachix only at publication runtime", required = false, providers = ["github-repository"] }
CACHIX_MAESTRO_PUBKEY = { description = "Public signing key for https://maestro.cachix.org, supplied by the GitHub repository variable and checked against the reviewed cache configuration", default = "maestro.cachix.org-1:fGFZFVwe2ZHEBENWZLHVzERZrz2c50ru+g0UewH68I0=", providers = ["github-repository"] }

[profiles.github-publish]
CACHIX_MAESTRO_AUTH_TOKEN = { description = "Maestro Cachix write token from the GitHub repository secret or workstation pass; mapped to Cachix only at publication runtime", required = true, providers = ["github-repository"] }
CACHIX_MAESTRO_PUBKEY = { description = "Public signing key for https://maestro.cachix.org, supplied by the GitHub repository variable and checked against the reviewed cache configuration", default = "maestro.cachix.org-1:fGFZFVwe2ZHEBENWZLHVzERZrz2c50ru+g0UewH68I0=", providers = ["github-repository"] }

[profiles.local-publish]
CACHIX_MAESTRO_AUTH_TOKEN = { description = "Maestro Cachix write token from the GitHub repository secret or workstation pass; mapped to Cachix only at publication runtime", required = true, providers = ["workstation-pass"], ref = { item = "cachix/maestro/auth_token" } }
CACHIX_MAESTRO_PUBKEY = { description = "Public signing key for https://maestro.cachix.org, supplied by the GitHub repository variable and checked against the reviewed cache configuration", default = "maestro.cachix.org-1:fGFZFVwe2ZHEBENWZLHVzERZrz2c50ru+g0UewH68I0=", providers = ["workstation-pass"], ref = { item = "cachix/maestro" } }

[profiles.github-policy]
SECAUDIT_CLIENTID = { description = "Organization GitHub App client ID used to mint repository-scoped security policy read tokens", required = true, providers = ["github-organization"] }
SECAUDIT_PEM = { description = "Organization GitHub App private key consumed only by the pinned token action at runtime for repository-scoped Administration read access", required = true, providers = ["github-organization"] }

[profiles.github-queue]
MERGE_QUEUE_TOKEN = { description = "Short-lived repository-scoped GitHub App token for protected queue admission; minted at runtime, never stored as a personal token", required = true, providers = ["github-organization", "github-repository"] }

[profiles.xcp]
XCP_HOSTPASSWORD = { description = "SecretOps runtime XCP-ng API password; never available to Nix evaluation or stored Packer variables", required = false, providers = ["xcp-runtime"] }
XCP_PASSWORD_PASS_ENTRY = { description = "Password-store entry resolved at deployment runtime, for example /VatesTrainingLab/hostpassword", required = false, providers = ["xcp-runtime"] }

[profiles.decision-app]
DECIDER_CLIENT = { description = "Human decision GitHub App client ID; resolve only at runtime", required = true, providers = ["github-organization"] }
DECIDER_KEY = { description = "GitHub App private key, consumed only by the pinned token action", required = true, providers = ["github-organization"] }
DECIDER_APP_ID = { description = "Public App integration ID mirrored in reviewed decision policy and main ruleset", required = true, providers = ["github-organization"] }

[profiles.decision-packets]
REGISTRY_TOKEN = { description = "Short-lived Actions package token for the dedicated immutable decision evidence registry", required = true, providers = ["github-repository"] }

[scopes.cachix]
secrets = ["CACHIX_MAESTRO_AUTH_TOKEN", "CACHIX_MAESTRO_PUBKEY"]

[scopes.xcp]
secrets = ["XCP_HOSTPASSWORD", "XCP_PASSWORD_PASS_ENTRY"]

[scopes.decision-app]
secrets = ["DECIDER_CLIENT", "DECIDER_KEY", "DECIDER_APP_ID"]

[scopes.decision-packets]
secrets = ["REGISTRY_TOKEN"]
