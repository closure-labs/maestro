# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
require_version: true

# Runtime commands resolve explicit SecretSpec profiles themselves. Ordinary
# development and hosted checks never resolve project credentials into Nix.
secretspec:
  enable: false
  provider: env
  profile: github
  # Public cache pulls do not require a publishing secret. The audited publish
  # commands map the Maestro-specific credential to Cachix only at runtime.
  cachix_auth_token: false

inputs:
  nixpkgs:
    url: https://flakehub.com/f/NixOS/nixpkgs/0
  devenv:
    url: github:cachix/devenv

nixpkgs:
  permitted_unfree_packages:
    - packer
